<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiumical</title>
<style>
:root { --bg: #000; --panel: #111; --text: #ccc; --accent: #fff; --dim: #555; --border: #222; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.6 'Segoe UI',system-ui,monospace; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
#output { flex:1; overflow-y:auto; padding:16px 20px; }
#output .line { padding:1px 0; }
#output .cmd { color:var(--accent); }
#output .think { color:var(--dim); font-style:italic; }
#output .err { color:#f66; }
#output .info { color:var(--dim); font-size:12px; }
#input-wrap { border-top:1px solid var(--border); padding:12px 20px; background:var(--panel); display:flex; align-items:center; }
#input-wrap .prompt { color:var(--accent); font-weight:bold; margin-right:8px; }
#input-wrap input { flex:1; background:transparent; border:none; color:var(--text); font:inherit; outline:none; }
#input-wrap input::placeholder { color:var(--dim); }
#status { padding:4px 20px; font-size:11px; color:var(--dim); display:flex; justify-content:space-between; border-top:1px solid #111; }
</style>
</head>
<body>
<div id="output">
  <div class="line">Radiumical <span class="info">— lean CLI coding agent</span></div>
  <div class="line info">Type a task or /help to begin.</div>
</div>
<div id="input-wrap"><span class="prompt">></span><input id="cmd" placeholder="ask anything..." autofocus></div>
<div id="status"><span id="think-status">ready</span><span id="model-info">deepseek-v4-pro | auto</span></div>
<script>
const invoke = window.__TAURI__?.invoke || window.__TAURI__?.core?.invoke;
if (!invoke) { document.getElementById('output').innerHTML += '<div class="err">Tauri API not loaded. Check CSP and withGlobalTauri.</div>'; }
const out = document.getElementById('output');
const cmd = document.getElementById('cmd');
const think = document.getElementById('think-status');
let buf = { current: '' };
function add(text, cls) {
  buf.current += text;
  // Flush completed lines (split by \n)
  while (buf.current.includes('\n')) {
    const idx = buf.current.indexOf('\n');
    const line = buf.current.slice(0, idx);
    buf.current = buf.current.slice(idx + 1);
    const d = document.createElement('div');
    d.className = 'line ' + (cls || '');
    d.textContent = line;
    out.appendChild(d);
  }
  out.scrollTop = out.scrollHeight;
}
function flush() {
  if (buf.current) {
    const d = document.createElement('div');
    d.className = 'line';
    d.textContent = buf.current;
    out.appendChild(d);
    buf.current = '';
    out.scrollTop = out.scrollHeight;
  }
}
cmd.onkeydown = async e => {
  if (e.key === 'Enter' && cmd.value.trim()) {
    const t = cmd.value.trim(); cmd.value = '';
    add('> ' + t, 'cmd');
    try {
      add('', ''); // spacing
      await invoke('run_task', { task: t });
      add('', '');
    } catch(err) {
      add('Error: ' + (typeof err === 'string' ? err : JSON.stringify(err)), 'err');
    }
  }
};

// Listen for streaming events from backend (Tauri v2)
(async () => {
  const { listen } = window.__TAURI__?.event || {};
  if (listen) {
    await listen('llm-chunk', (e) => { add(e.payload, ''); });
    await listen('tool-start', (e) => { flush(); add(e.payload, 'tool'); });
    await listen('llm-done', () => { flush(); });
    await listen('llm-error', (e) => { flush(); add(e.payload, 'err'); });
  }
})();
</script>
</body>
</html>
