name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'pre-v[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build release binaries ──────────────────────────────────
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: radiumical
            rpc_binary: radiumical-rpc
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: radiumical
            rpc_binary: radiumical-rpc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: radiumical.exe
            rpc_binary: radiumical-rpc.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}

      - name: Build release
        run: cargo build --package radiumical --package radiumical-rpc --profile release-small --target ${{ matrix.target }}

      - name: Strip binaries (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release-small/${{ matrix.binary }}
          strip target/${{ matrix.target }}/release-small/${{ matrix.rpc_binary }}

      - name: Upload TUI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release-small/${{ matrix.binary }}
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
          body: |
            ${{ startsWith(github.ref_name, 'pre-') && '⚠️ **Pre-release** — not production ready.' || format('Release {} of Radiumical.', github.ref_name) }}

            Binaries:
            - Linux x64: `radiumical-linux-x64`, `radiumical-rpc-linux-x64`
            - macOS x64: `radiumical-macos-x64`, `radiumical-rpc-macos-x64`
            - Windows x64: `radiumical-windows-x64.exe`, `radiumical-rpc-windows-x64.exe`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload RPC to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release-small/${{ matrix.rpc_binary }}
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
