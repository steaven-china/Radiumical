name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'pre-v[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: radiumical-tauri/package-lock.json

      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libappindicator3-dev librsvg2-dev \
            build-essential wget file libssl-dev

      - name: Install npm dependencies
        working-directory: radiumical-tauri
        run: npm ci

      - name: Build Tauri frontend
        working-directory: radiumical-tauri
        run: npm run build

      - name: Build TUI and RPC
        run: cargo build --package radiumical --package radiumical-rpc --profile release-small --target ${{ matrix.target }}

      - name: Build Tauri (custom-protocol enabled)
        run: cargo build --package radiumical-tauri --profile release-small --target ${{ matrix.target }} --features custom-protocol

      - name: Organize output
        shell: bash
        run: |
          BASE="target/${{ matrix.target }}/release-small"
          for dir in tui rpc tauri; do mkdir -p "$BASE/$dir"; done

          # tui
          cp "$BASE/radiumical"*         "$BASE/tui/"      2>/dev/null || true
          # rpc
          cp "$BASE/radiumical-rpc"*     "$BASE/rpc/"      2>/dev/null || true
          # tauri
          cp "$BASE/radiumical-tauri"*   "$BASE/tauri/"    2>/dev/null || true

      - name: Strip binaries (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          BASE="target/${{ matrix.target }}/release-small"
          find "$BASE/tui" "$BASE/rpc" "$BASE/tauri" -type f ! -name '*.d' -exec strip {} + 2>/dev/null || true

      - name: Rename for release
        shell: bash
        run: |
          SUFFIX="${{ matrix.suffix }}"
          BASE="target/${{ matrix.target }}/release-small"

          for dir in tui rpc tauri; do
            for f in "$BASE/$dir/"*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              [[ "$name" == *.d ]] && continue
              ext="${name##*.}"
              stem="${name%.*}"
              if [[ "$ext" == "$name" || "$ext" == "exe" ]]; then
                new="${stem}-${SUFFIX}"
                [[ "$ext" == "exe" ]] && new="${new}.exe"
              else
                new="${stem}-${SUFFIX}.${ext}"
              fi
              cp "$f" "$BASE/$dir/$new"
            done
          done

      - name: Upload TUI
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release-small/tui/*
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
          body: |
            ${{ startsWith(github.ref_name, 'pre-') && '⚠️ **Pre-release** — not production ready.' || format('Release {} of Radiumical.', github.ref_name) }}

            Binaries per platform:
            - `radiumical-{linux,macos,windows-x64}` — TUI agent
            - `radiumical-rpc-{linux,macos,windows-x64}` — RPC server
            - `radiumical-tauri-{linux,macos,windows-x64}` — Tauri backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload RPC
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release-small/rpc/*
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Tauri
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release-small/tauri/*
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
