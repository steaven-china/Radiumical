name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'pre-v[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build release binaries ──────────────────────────────────
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: radiumical
            rpc_binary: radiumical-rpc
            asset_name: radiumical-linux-x64
            rpc_asset_name: radiumical-rpc-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: radiumical
            rpc_binary: radiumical-rpc
            asset_name: radiumical-macos-x64
            rpc_asset_name: radiumical-rpc-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: radiumical.exe
            rpc_binary: radiumical-rpc.exe
            asset_name: radiumical-windows-x64.exe
            rpc_asset_name: radiumical-rpc-windows-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}

      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libappindicator3-dev librsvg2-dev \
            build-essential wget file libssl-dev

      - name: Build release
        run: cargo build --workspace --profile release-small --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release-small/${{ matrix.binary }}

      - name: Upload TUI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release-small/${{ matrix.binary }}
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
          body: |
            ${{ startsWith(github.ref_name, 'pre-') && '⚠️ **Pre-release** — not production ready.' || format('Release {} of Radiumical.', github.ref_name) }}

            Binaries:
            - Linux x64 (`radiumical-linux-x64`)
            - macOS x64 (`radiumical-macos-x64`)
            - Windows x64 (`radiumical-windows-x64.exe`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload RPC to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release-small/${{ matrix.rpc_binary }}
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
